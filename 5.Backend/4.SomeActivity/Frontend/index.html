<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regestration Form</title>
</head>
<body>
    <h1>GET Request Method</h1>
    <form  method="GET" action="http://localhost:8080/register">
        <input type="text" placeholder="Enter UserName" name="user">
        <input type="Password"placeholder="Enter Password" name="pass">
        <button type="submit">Submit</button>
    </form>
    <hr><hr>

    <h1>POST Request Method</h1>
    <form  method="POST" action="http://localhost:8080/register">
        <input type="text" placeholder="Enter UserName" name="user">
        <input type="Password"placeholder="Enter Password" name="pass">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
